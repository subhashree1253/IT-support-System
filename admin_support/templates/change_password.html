<!-- change_password.html -->
<!DOCTYPE html>
<html>
  <head>
    <title>Change Password</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light p-5">
    <div class="container">
      {% if messages %} {% for message in messages %}
      <div class="alert alert-{{ message.tags }}">{{ message }}</div>
      {% endfor %} {% endif %}

      <div class="card shadow-sm p-4 mx-auto" style="max-width: 400px">
        <h4 class="mb-4">🔒 Change Password</h4>
        <form action="{% url 'update_password' %}" method="POST">
          {% csrf_token %}
          <div class="mb-3">
            <input
              type="password"
              name="old_password"
              class="form-control"
              placeholder="Old Password"
              required
            />
          </div>
          <div class="mb-3">
            <input
              type="password"
              name="new_password1"
              class="form-control"
              placeholder="New Password"
              required
            />
          </div>
          <div class="mb-3">
            <input
              type="password"
              name="new_password2"
              class="form-control"
              placeholder="Confirm New Password"
              required
            />
          </div>
          <input
            type="submit"
            class="btn btn-primary w-100"
            value="Change Password"
          />
        </form>
      </div>
    </div>

    <!-- Toast Container -->
    <div class="position-fixed top-0 end-0 p-3" style="z-index: 1055">
      <div
        id="toastMessage"
        class="toast align-items-center text-white bg-primary border-0"
        role="alert"
        aria-live="assertive"
        aria-atomic="true"
      >
        <div class="d-flex">
          <div class="toast-body" id="toastText">Message</div>
          <button
            type="button"
            class="btn-close btn-close-white me-2 m-auto"
            data-bs-dismiss="toast"
            aria-label="Close"
          ></button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
#chat-box {
    width: 300px;
    height: 350px;
    background: white;
    border-radius: 10px;
    box-shadow: 0px 0px 10px #999;
    position: fixed;
    bottom: 90px;
    right: 20px;
    display: none;
    padding: 10px;
    font-size: 14px;
    z-index: 9999;
}
#chat-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #007bff;
    color: white;
    padding: 15px 20px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 20px;
    z-index: 9999;
}
</style>

<div id="chat-btn">💬</div>

<div id="chat-box">
    <h5>Virtual Assistant</h5>
    <div id="chat-area" style="height:250px; overflow-y:auto; border:1px solid #ddd; padding:5px;"></div>
    <input type="text" id="user-input" class="form-control" placeholder="Type your message...">
</div>

<script>
document.getElementById("chat-btn").onclick = function(){
    var chatBox = document.getElementById("chat-box");
    chatBox.style.display = (chatBox.style.display === "block") ? "none" : "block";
};

document.getElementById("user-input").addEventListener("keypress", function(e){
    if(e.key === "Enter"){
        let msg = this.value;
        document.getElementById("chat-area").innerHTML += "<b>You:</b> " + msg + "<br>";

        fetch(`/virtual_assistant/?msg=${msg}`)
        .then(response => response.json())
        .then(data => {
            document.getElementById("chat-area").innerHTML += "<b>Assistant:</b> " + data.reply + "<br>";
        });

        this.value = "";
    }
});
</script>

    
  </body>
</html>
