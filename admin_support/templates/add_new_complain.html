{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Add User Complain</title>
    {% include 'link.html' %}
  </head>
  <body
    class="hold-transition light-mode sidebar-mini layout-fixed layout-navbar-fixed layout-footer-fixed"
  >
    <div class="wrapper">
      {% include 'base.html' %}

      <div class="content-wrapper">
        <div class="content-header">
          <div class="container-fluid">
            <h1 class="m-0">ADD USER COMPLAIN</h1>
          </div>
        </div>

        <section class="content">
          <div class="container-fluid">
            <div class="card card-primary">
              <div class="card-header">
                <h3 class="card-title">Complaint Form</h3>
              </div>
              <form action="{% url 'insert_user_complain' %}" method="post">
                {% csrf_token %}
                <div class="card-body">
                  <div class="form-group">
                    <label>Department</label>
                    <select
                      name="department"
                      id="dept"
                      class="form-control"
                      required
                    >
                      <option value="">Select Department</option>
                      {% for d in departments %}
                      <option value="{{ d.dept_id }}">
                        {{ d.department }}
                      </option>
                      {% endfor %}
                    </select>
                    <label>Employee Name</label>
                    <select name="user" id="user" class="form-control" required>
                      <option value="">Select User</option>
                      {% for u in users %}
                      <option value="{{ u.id }}">{{ u.name }}</option>
                      {% endfor %}
                    </select>
                    <label>Email ID</label>
                    <input
                      type="email"
                      id="email"
                      name="email_id"
                      class="form-control"
                      required
                    />

                    <label>Complain Type</label>
                    <select
                      name="complain_type"
                      id="complain_type"
                      class="form-control"
                      required
                    >
                      <option value="">Select Type</option>
                      {% for ct in complain_types %}
                      <option value="{{ ct.complain_id }}">
                        {{ ct.complain }}
                      </option>
                      {% endfor %}
                    </select>

                    <label>Complain Description</label>
                    <select
                      name="complain_desc"
                      id="complain_desc"
                      class="form-control"
                      required
                    >
                      <option value="">Select Description</option>
                      {% for cd in complain_desc %}
                      <option value="{{ cd.id }}">{{ cd.description }}</option>
                      {% endfor %}
                    </select>

                    <label>Forward To</label>
                    <select name="it_team" class="form-control" required>
                      <option value="">Select IT Member</option>
                      {% for it in it_teams %}
                      <option value="{{ it.it_team_id }}">{{ it.name }}</option>
                      {% endfor %}
                    </select>
                  </div>
                </div>

                <div class="card-footer">
                  <button type="submit" class="btn btn-primary">Submit</button>
                  <button type="reset" class="btn btn-secondary">Reset</button>
                </div>
              </form>

              {% if success %}
              <div class="alert alert-success m-3">
                Complain added successfully!
              </div>
              {% endif %}
            </div>
          </div>
        </section>
      </div>

      {% include 'footer.html' %}
    </div>
    {% include 'scriptfile.html' %}
    <script>
      $(document).ready(function () {
        $("#dept").change(function () {
          var dep = $("#dept").val();

          // Ajax code to fetch roles option wrt to department
          $.ajax({
            url: '{% url "fetch_user" %}',
            data: {
              dept: dep,
            },

            type: "GET",

            dataType: "json",

            success: function (data) {
              console.log(data); // You can remove or modify this as needed for debugging

              // Clear the existing options in the #role dropdown
              $("#user").empty();

              // Add a default "Select" option
              $("#user").append('<option value="">Select a role</option>');

              // Loop through the fetched data and append options to the dropdown
              $.each(data, function (index, user) {
                // Append each user to the dropdown
                $("#user").append(
                  $("<option></option>").val(user[0]).html(user[1])
                );
              });
            },
          });
        });
      });
    </script>

    <script>
      $(document).ready(function () {
        $("#user").change(function () {
          var dep = $("#user").val();

          // Ajax code to fetch roles option wrt to department
          $.ajax({
            url: '{% url "fetch_user_email" %}',
            data: {
              user: dep,
            },

            type: "GET",

            dataType: "json",

            success: function (data) {
              console.log(data); // You can remove or modify this as needed for debugging

              // Clear the existing options in the #role dropdown
              $("#email").val(data);
                
              
            },
          });
        });
      });
    </script>

    <script>
  $(document).ready(function () {
    // When Complain Type changes
    $("#complain_type").change(function () {
      var complainTypeId = $(this).val();

      // AJAX request to get related complaint descriptions
      $.ajax({
        url: '{% url "fetch_complain_desc_by_type" %}',  // Define this URL in urls.py
        data: {
          complain_type_id: complainTypeId
        },
        type: 'GET',
        dataType: 'json',
        success: function (data) {
          console.log(data);  // Debug log

          // Clear the existing options in #complain_desc
          $("#complain_desc").empty();

          // Add a default option
          $("#complain_desc").append('<option value="">Select Description</option>');

          // Loop through returned data and add options
          $.each(data, function (index, item) {
            $("#complain_desc").append(
              $("<option></option>").val(item[0]).html(item[1])
            );
          });
        },
        error: function (xhr, status, error) {
          console.error("Error fetching descriptions:", error);
        }
      });
    });
  });
</script>
<style>
#chat-box {
    width: 300px;
    height: 350px;
    background: white;
    border-radius: 10px;
    box-shadow: 0px 0px 10px #999;
    position: fixed;
    bottom: 90px;
    right: 20px;
    display: none;
    padding: 10px;
    font-size: 14px;
    z-index: 9999;
}
#chat-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #007bff;
    color: white;
    padding: 15px 20px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 20px;
    z-index: 9999;
}
</style>

<div id="chat-btn">💬</div>

<div id="chat-box">
    <h5>Virtual Assistant</h5>
    <div id="chat-area" style="height:250px; overflow-y:auto; border:1px solid #ddd; padding:5px;"></div>
    <input type="text" id="user-input" class="form-control" placeholder="Type your message...">
</div>

<script>
document.getElementById("chat-btn").onclick = function(){
    var chatBox = document.getElementById("chat-box");
    chatBox.style.display = (chatBox.style.display === "block") ? "none" : "block";
};

document.getElementById("user-input").addEventListener("keypress", function(e){
    if(e.key === "Enter"){
        let msg = this.value;
        document.getElementById("chat-area").innerHTML += "<b>You:</b> " + msg + "<br>";

        fetch(`/virtual_assistant/?msg=${msg}`)
        .then(response => response.json())
        .then(data => {
            document.getElementById("chat-area").innerHTML += "<b>Assistant:</b> " + data.reply + "<br>";
        });

        this.value = "";
    }
});
</script>





  </body>
</html>
