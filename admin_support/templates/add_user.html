    <div class="container-fluid">
      <div class="row mb-2">
        <div class="col-sm-6">
          <h1 class="m-0">EMPLOYEE</h1>
        </div><!-- /.col -->

      </div><!-- /.row -->

    <div class="container-fluid">

        <!-- left column -->

          <!-- general form elements -->
          <div class="card card-primary">
            <div class="card-header">
              <h3 class="card-title">ADD NEW USER</h3>
            </div>
            <!-- /.card-header -->
            <!-- form start -->

          

            
            <form action="{% url 'insert_user' %}" method="post">
                {% csrf_token %}
              <div class="card-body">

                <div class="row">
                  <div class="col-md-12">
                    <div class="form-group">

<label>Department Name :</label>
<select class="form-control" name="department" required>
  <option value="">Select Department</option>
  {% for dept in department %}
    <option value="{{ dept.dept_id }}">{{ dept.department }}</option>
  {% endfor %}
</select>


<label>Employee Name :</label>
<input type="text" class="form-control" name="username" placeholder="Employee name" required>

<label>System IP Address:</label>
<input type="text" class="form-control" name="ip_address" placeholder="IP Address" required>

<label>Mobile No.:</label>
<input type="text" class="form-control" name="mobile" placeholder="Mobile No." required>

<label>System Name:</label>
<input type="text" class="form-control" name="system_name" placeholder="System Name" required>

<label>Email ID:</label>
<input type="email" class="form-control" name="email_id" placeholder="Email ID" required>

                    </div>
                   
                  </div>

                  
                </div>
              </div>
              <!-- /.card-body -->


            <div class="card-footer">
                <button type="submit" class="btn btn-primary swalDefaultSuccess" name="submit" id="submit" onclick="return validateForm()" name="submit" id="submit">Submit</button>
                <button type="reset" class="btn btn-warning">Reset</button>
              </div>
            </form>
          </div>

             
          <!-- /.card -->
      
         
</div>

{% if success %}
<div class="alert alert-success">User added successfully!</div>
{% endif %}

<script>
  function validateForm() {
    var name = document.getElementById("name").value;
    var email = document.getElementById("email_id").value;
    var ipAddress = document.getElementById("IP_address").value;
    var mobNumber = document.getElementById("Mob_number").value;

    if (name == "" || email == "" || ipAddress == "" || mobNumber == "") {
      alert("All fields must be filled out");
      return false;
    }

    // Additional validation can be added here

    return true; // Form is valid
  }
</script>
<style>
#chat-box {
    width: 300px;
    height: 350px;
    background: white;
    border-radius: 10px;
    box-shadow: 0px 0px 10px #999;
    position: fixed;
    bottom: 90px;
    right: 20px;
    display: none;
    padding: 10px;
    font-size: 14px;
    z-index: 9999;
}
#chat-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #007bff;
    color: white;
    padding: 15px 20px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 20px;
    z-index: 9999;
}
</style>

<div id="chat-btn">💬</div>

<div id="chat-box">
    <h5>Virtual Assistant</h5>
    <div id="chat-area" style="height:250px; overflow-y:auto; border:1px solid #ddd; padding:5px;"></div>
    <input type="text" id="user-input" class="form-control" placeholder="Type your message...">
</div>

<script>
document.getElementById("chat-btn").onclick = function(){
    var chatBox = document.getElementById("chat-box");
    chatBox.style.display = (chatBox.style.display === "block") ? "none" : "block";
};

document.getElementById("user-input").addEventListener("keypress", function(e){
    if(e.key === "Enter"){
        let msg = this.value;
        document.getElementById("chat-area").innerHTML += "<b>You:</b> " + msg + "<br>";

        fetch(`/virtual_assistant/?msg=${msg}`)
        .then(response => response.json())
        .then(data => {
            document.getElementById("chat-area").innerHTML += "<b>Assistant:</b> " + data.reply + "<br>";
        });

        this.value = "";
    }
});
</script>

</body> 
</html>
