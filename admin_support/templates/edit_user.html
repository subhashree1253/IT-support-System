{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WODC FTMS</title>
    {% include 'link.html' %}
  </head>
  <body
    class="hold-transition light-mode sidebar-mini layout-fixed layout-navbar-fixed layout-footer-fixed"
  >
    <div class="wrapper">
      {% include 'base.html' %}

      <div class="content-wrapper">
        <div class="content-header">
          <div class="container-fluid">
            <div class="row mb-2">
              <div class="col-sm-6">
                <h1 class="m-0">EDIT USER</h1>
              </div>
            </div>
          </div>
        </div>

        <section class="content">
          <div class="container-fluid">
            <div class="row">
              <div class="col-md-12">
                <div class="card card-primary">
                  <div class="card-header">
                    <h3 class="card-title">EDIT USER DETAILS</h3>
                  </div>

                  <form action="{%url 'update_user' %}" method="post">
                    {% csrf_token %}
                    <div class="card-body">
                      <div class="row">
                        <div class="col-md-12">
                          <div class="form-group">
                            <label>Department Name :</label>
                           <select class="form-control" name="department" required>
  <option value="">Select Department</option>
  {% for dept in department %}
    <option value="{{ dept.dept_id }}"
      {% if user.dept and dept.dept_id == user.dept.dept_id %}selected{% endif %}>
      {{ dept.department }}
    </option>
  {% endfor %}
</select>


                            <label>Employee Name :</label>
                            <input
                              type="text"
                              class="form-control"
                              name="username"
                              placeholder="Employee name"
                              required
                              value="{{user.username}}"
                            />

                            <label>System IP Address:</label>
                            <input
                              type="text"
                              class="form-control"
                              name="ip_address"
                              placeholder="IP Address"
                              value = '{{user.user_ip}}'
                              required
                            />

                            <label>Mobile No.:</label>
                            <input
                              type="text"
                              class="form-control"
                              name="mobile"
                              placeholder="Mobile No."
                              value = '{{user.mobile}}'
                              required
                            />

                            <label>System Name:</label>
                            <input
                              type="text"
                              class="form-control"
                              name="system_name"
                              placeholder="System Name"
                              value='{{user.system_name}}'
                              required
                            />

                            <label>Email ID:</label>
                            <input
                              type="email"
                              class="form-control"
                              name="email_id"
                              placeholder="Email ID"
                              value='{{user.email_id}}'
                              required
                            />
                          </div>
                        </div>
                      </div>
                    </div>

                    <input type="hidden" name="user_id" value="{{user.user_id}}">

                    <div class="card-footer">
                      <button
                        type="update"
                        class="btn btn-primary swalDefaultSuccess"
                        name="update"
                        id="update"
                        onclick="return validateForm()"
                        name="update"
                        id="update"
                      >
                        Update
                      </button>
                      <button type="Cancel" class="btn btn-warning">
                        Cancel
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>

      {% include 'footer.html' %}
      <aside class="control-sidebar control-sidebar-dark"></aside>
    </div>

    {% include 'scriptfile.html' %}
    <style>
#chat-box {
    width: 300px;
    height: 350px;
    background: white;
    border-radius: 10px;
    box-shadow: 0px 0px 10px #999;
    position: fixed;
    bottom: 90px;
    right: 20px;
    display: none;
    padding: 10px;
    font-size: 14px;
    z-index: 9999;
}
#chat-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #007bff;
    color: white;
    padding: 15px 20px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 20px;
    z-index: 9999;
}
</style>

<div id="chat-btn">💬</div>

<div id="chat-box">
    <h5>Virtual Assistant</h5>
    <div id="chat-area" style="height:250px; overflow-y:auto; border:1px solid #ddd; padding:5px;"></div>
    <input type="text" id="user-input" class="form-control" placeholder="Type your message...">
</div>

<script>
document.getElementById("chat-btn").onclick = function(){
    var chatBox = document.getElementById("chat-box");
    chatBox.style.display = (chatBox.style.display === "block") ? "none" : "block";
};

document.getElementById("user-input").addEventListener("keypress", function(e){
    if(e.key === "Enter"){
        let msg = this.value;
        document.getElementById("chat-area").innerHTML += "<b>You:</b> " + msg + "<br>";

        fetch(`/virtual_assistant/?msg=${msg}`)
        .then(response => response.json())
        .then(data => {
            document.getElementById("chat-area").innerHTML += "<b>Assistant:</b> " + data.reply + "<br>";
        });

        this.value = "";
    }
});
</script>

  </body>
</html>
