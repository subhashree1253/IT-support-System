<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">

  {% include 'link.html' %}
</head>
<body class="hold-transition light-mode sidebar-mini layout-fixed layout-navbar-fixed layout-footer-fixed">
<div class="wrapper">


<!-- navbar -->

 {% include 'base.html' %}





<!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
  <!-- Content Header (Page header) -->
  <div class="content-header">
    <div class="container-fluid">
      <div class="row mb-2">
        <div class="col-sm-6">
          <h1 class="m-0">EDIT DEPARTMENT</h1>
        </div><!-- /.col -->

      </div><!-- /.row -->
    </div><!-- /.container-fluid -->
  </div>
  <!-- /.content-header -->

  <section class="content">
    <div class="container-fluid">
      <div class="row">
        <!-- left column -->
        <div class="col-md-12">
          <!-- general form elements -->
          <div class="card card-primary">
            <div class="card-header">
              <h3 class="card-title">EDIT DEPARTMENT</h3>
            </div>
            <!-- /.card-header -->
            <!-- form start -->
          

            
            <form action="/update_department" method="post">
              {% csrf_token %}
              <div class="card-body">

                <div class="row">
                  <div class="col-md-12">
                    <div class="form-group">

                      <label for="exampleInputEmail1">State Name :</label>
                      <input type="text" class="form-control" id="name" name="name" placeholder="State name" required value="{{ department.department }}">
                      
                      <label for="exampleInputEmail1">Status :</label>
                      <select class="form-control" id="status" name="status" placeholder="Active / Inactive">
                        <option value="">select status</option>
                        {% if department.department_status == 'Active' %}
                        <option value="Active" selected>Active</option>
                        <option value="Inactive">Inactive</option>
                        {% else %}
                        <option value="Active">Active</option>
                        <option value="Inactive" selected>Inactive</option>
                        {% endif %}
                      </select>
                    </div>
                   
                  </div>
                  <input type="hidden" name="dept_id" value="{{ department.dept_id }}">
                  
                </div>
              </div>
              <!-- /.card-body -->

              <div class="card-footer">
                <button type="update" class="btn btn-primary swalDefaultSuccess" name="update" id="update" onclick="return validateForm()" name="update" id="update">Update</button>
                <button type="Cancel" class="btn btn-warning">Cancel</button>
              </div>
            </form>
          </div>
          <!-- /.card -->
      
         

</div>

<!-- /.content -->
</div>
{% include 'footer.html' %}

<!-- Control Sidebar -->

<script>
function validateForm() {
  var name = document.getElementById("name").value;
  if (name == "") {
    alert("Name must be filled out");
    return false;
  }
  // Add more validation as needed
  return true;
}
</script>
<style>
#chat-box {
    width: 300px;
    height: 350px;
    background: white;
    border-radius: 10px;
    box-shadow: 0px 0px 10px #999;
    position: fixed;
    bottom: 90px;
    right: 20px;
    display: none;
    padding: 10px;
    font-size: 14px;
    z-index: 9999;
}
#chat-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #007bff;
    color: white;
    padding: 15px 20px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 20px;
    z-index: 9999;
}
</style>

<div id="chat-btn">💬</div>

<div id="chat-box">
    <h5>Virtual Assistant</h5>
    <div id="chat-area" style="height:250px; overflow-y:auto; border:1px solid #ddd; padding:5px;"></div>
    <input type="text" id="user-input" class="form-control" placeholder="Type your message...">
</div>

<script>
document.getElementById("chat-btn").onclick = function(){
    var chatBox = document.getElementById("chat-box");
    chatBox.style.display = (chatBox.style.display === "block") ? "none" : "block";
};

document.getElementById("user-input").addEventListener("keypress", function(e){
    if(e.key === "Enter"){
        let msg = this.value;
        document.getElementById("chat-area").innerHTML += "<b>You:</b> " + msg + "<br>";

        fetch(`/virtual_assistant/?msg=${msg}`)
        .then(response => response.json())
        .then(data => {
            document.getElementById("chat-area").innerHTML += "<b>Assistant:</b> " + data.reply + "<br>";
        });

        this.value = "";
    }
});
</script>

</body>
</html>
